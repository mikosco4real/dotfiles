# ~/.config/tmux/tmux.conf
# tmux >= 3.1 reads this XDG path; nothing needs to live in $HOME any more.
# Reload with: prefix + r

# ─── Terminal capabilities ────────────────────────────────────────────────────
# This block is the fix for Neovim themes looking washed out inside tmux —
# without it tmux advertises only 256 colours and swallows undercurls.
#   RGB      -> 24-bit truecolour
#   usstyle  -> undercurl + coloured underlines (LSP diagnostics in nvim)
# `terminal-features` (tmux 3.2+) is the modern replacement for the old
# `terminal-overrides` Smulx/Setulc escape-sequence incantations.
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"
set  -as terminal-features ",*:usstyle"

# ─── General behaviour ────────────────────────────────────────────────────────
set  -g  mouse on
set  -g  escape-time 10          # default 500ms makes <Esc> feel laggy in nvim
set  -g  history-limit 50000     # default 2000 is far too small
set  -g  focus-events on         # lets nvim autoread / gitsigns notice changes
set  -g  display-time 2000
set  -g  allow-rename off        # keep the window names setup-session.sh sets

# System clipboard via OSC 52. Works in Ghostty and kitty, locally *and* over
# SSH, on both macOS and Linux — which is why this is preferred over branching
# on pbcopy vs wl-copy/xclip.
set  -g  set-clipboard on

# ─── Key bindings ─────────────────────────────────────────────────────────────
# Prefix stays C-b. Splits, pane navigation and reload are unchanged.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Full reload, theme included. A plain `source-file` does NOT refresh catppuccin
# — it composes its modules with `set -ogq`, so already-composed values survive
# and theme edits silently appear to do nothing. See the script for detail.
bind r run-shell "~/.config/tmux/scripts/reload.sh"

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# vi-style copy mode; y copies to the system clipboard through OSC 52.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ─── Session layout ───────────────────────────────────────────────────────────
# Auto-create the IDE/GIT/Terminal/Logs/Claude layout for every new session.
# The script is idempotent — it no-ops when the session already has >1 window.
# Manual re-apply / fallback: prefix + L
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/setup-session.sh #{session_name}"'
bind L run-shell "~/.config/tmux/scripts/setup-session.sh #{session_name}"

# ─── Plugins ──────────────────────────────────────────────────────────────────
# tpm and the plugins themselves are vendored by chezmoi
# (see home/.chezmoiexternal.toml), so `prefix + I` is not needed on a fresh
# machine.
#
# Pin the plugin path explicitly rather than relying on tpm's XDG auto-detection.
# tpm only auto-detects when TMUX_PLUGIN_MANAGER_PATH is absent from the global
# tmux environment — and that variable is exported into every pane, so a tmux
# session started before this migration leaks the old ~/.tmux/plugins/ value into
# any nested or later-started server. tpm then looks in the wrong place and finds
# nothing, silently, because it pipes all plugin output to /dev/null. Verified
# empirically: this exact failure occurred here.
#
# Note tmux expands "$HOME" in double quotes but does NOT expand a bare ~, so the
# quoting below is load-bearing.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# ─── Catppuccin (v2 API) ──────────────────────────────────────────────────────
# ORDER IS LOAD-BEARING, and differs from v0.3:
#   1. set @catppuccin_* options            (below)
#   2. run catppuccin.tmux                  — defines @thm_* colours + modules
#   3. set status-left / status-right       — must come AFTER step 2
#   4. run tpm                              — LAST; substitutes plugin placeholders
#
# The theme is loaded directly with `run` rather than declared as a tpm @plugin,
# because status-right has to be assembled between the theme loading and tpm
# running. chezmoi vendors it, so there is nothing for tpm to install anyway.

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

# ── Windows ───────────────────────────────────────────────────────────────────
# `rounded` gives the pill-shaped tabs. Other options: basic, slanted, custom, none.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon" # zoom / bell / activity markers

# Show the WINDOW NAME (#W), which setup-session.sh sets to IDE / GIT / Terminal
# / Logs / Claude and `allow-rename off` then preserves.
#
# Both lines matter. Previously window_current_text was "#{pane_current_path}",
# which v2 still honours — that is why the active tab showed a path. And
# window_text was unset, so v2's default of " #T" (pane_title) applied, which
# resolves to the hostname — that is why every other tab showed the machine name.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ══════════════════════════════════════════════════════════════════════════════
# STATUS LINE KNOBS — the only part of this file you should need to touch
# ══════════════════════════════════════════════════════════════════════════════
# Flip a segment to "on" and reload with `prefix + r`. No other edits needed.
# Segments render left to right in the order listed here.
#
# Everything is already installed, so turning one on Just Works:
#   cpu, ram        tmux-cpu       (vendored via .chezmoiexternal.toml)
#   battery         tmux-battery   (vendored)
#   gitmux          gitmux binary  (Brewfile) + ~/.gitmux.conf
#   load, uptime    no dependency  (they parse `uptime`)
#   weather         scripts/weather.sh
#   date_time       no dependency
#
# The extra ones default to off only to keep the bar uncluttered — each was
# verified working before being wired up here.

# ── status-left ──
set -g @status_gitmux "off" # git branch + dirty state for the current pane

# ── status-right, in display order ──
set -g @status_cpu "off"      #  CPU %
set -g @status_ram "off"      #  RAM %
set -g @status_load "off"     # 󰊚 load average
set -g @status_uptime "off"   # 󰔟 uptime
set -g @status_weather "on"   # location, condition, temperature
set -g @status_battery "on"   # battery icon + %
set -g @status_datetime "on"  # 󰃰 date, time, timezone

# ── Weather knobs ──
set -g @weather_location "Sydney" # any wttr.in-recognised place name
set -g @weather_units "m"         # m = metric (°C), u = USCS (°F)
set -g @weather_ttl "900"         # cache lifetime in seconds

# ── Module appearance ─────────────────────────────────────────────────────────
# These MUST be set before catppuccin loads: its module files use `set -ogq`,
# which assigns only when the option is still unset, so whatever is set here wins.
#
# And they must NOT use `set -gF`. The -F expands immediately, before
# catppuccin.tmux has defined @thm_*, which silently yields an EMPTY colour —
# status-right then renders "#[fg=]" with a blank bg. Storing the format string
# unexpanded lets the module resolve it at load time, when @thm_* exist.

set -g @catppuccin_date_time_text " %a %d %b  %H:%M %Z"

# #{l:...} keeps the #(...) literal through the -F expansion of status-right
# below, so tmux re-runs the script on each refresh instead of baking in one
# reading at load time.
set -g @catppuccin_weather_icon ""
set -g @catppuccin_weather_color "#{E:@thm_peach}"
set -g @catppuccin_weather_text "#{l:#(~/.config/tmux/scripts/weather.sh)}"

set -g @catppuccin_battery_color "#{E:@thm_green}"
set -g @catppuccin_cpu_color "#{E:@thm_yellow}"
set -g @catppuccin_ram_color "#{E:@thm_sky}"
set -g @catppuccin_load_color "#{E:@thm_maroon}"
set -g @catppuccin_uptime_color "#{E:@thm_lavender}"
set -g @catppuccin_gitmux_color "#{E:@thm_mauve}"

# UPSTREAM BUG WORKAROUND (catppuccin v2.3.0).
# Most modules wrap their #(...) in #{l:...} so the shell command survives the -F
# expansion of status-right and is re-run on every refresh. `uptime` and `gitmux`
# do not, so with #{E:...} their commands execute ONCE at config-parse time and
# the result is frozen into the status line. Verified: neither appeared among the
# live #(...) entries in status-right, and gitmux baked in as EMPTY because there
# is no pane context during parsing — which is exactly why its pill rendered with
# no text. Re-declare both with the protective wrapper.
#
# Single-quoted so tmux stores the value verbatim rather than expanding it now.
# (gitmux's equivalent override cannot live here — see below the theme load.)
set -g @catppuccin_uptime_text '#{l:#(uptime | sed -E "s/.*up +//; s/, +[0-9]+ user.*//")}'

# ── Load the theme ────────────────────────────────────────────────────────────
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

# gitmux is the one module whose text override must come AFTER the theme load.
# Every other module declares its default with `set -ogq` (assign only if unset),
# which is what lets the overrides above win — but status/gitmux.conf uses plain
# `set -gq`, so it OVERWRITES anything set beforehand. Verified: the pre-load
# override was silently discarded and the pill rendered with no text at all.
#
# The #{l:...} wrapper is still required so the #(...) survives the -F expansion
# of status-left and re-runs per refresh with real pane context; without it the
# command ran once during parsing, when #{pane_current_path} was empty.
set -g @catppuccin_gitmux_text '#{l: #(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}")}'

# ── Assemble the status line (AFTER the theme, BEFORE tpm) ────────────────────
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 140
set -g status-interval 15

# Segments are appended with -agF, never -ag: the F expands the catppuccin module
# now, while leaving the helper plugins' own #{...} placeholders literal for tpm
# to substitute in step 4.
#
# Toggling uses if-shell rather than tmux's own `%if`. Verified: `%if` conditions
# are evaluated while the file is parsed, with no session context, so
# `#{@status_cpu}` and even `#{ENV:...}` resolve to empty and every branch is
# skipped — `%if "#{==:1,1}"` works, `%if "#{==:#{@knob},on}"` does not. if-shell
# shells out to the real tmux binary, so it can read the options, and it was
# verified to preserve append order.

set -g status-left "#{E:@catppuccin_status_session}"
if-shell '[ "$(tmux show-option -gqv @status_gitmux)" = "on" ]' \
  'set -agF status-left "#{E:@catppuccin_status_gitmux}"'

set -g status-right ""
if-shell '[ "$(tmux show-option -gqv @status_cpu)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_cpu}"'
if-shell '[ "$(tmux show-option -gqv @status_ram)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_ram}"'
if-shell '[ "$(tmux show-option -gqv @status_load)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_load}"'
if-shell '[ "$(tmux show-option -gqv @status_uptime)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_uptime}"'
if-shell '[ "$(tmux show-option -gqv @status_weather)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_weather}"'
if-shell '[ "$(tmux show-option -gqv @status_battery)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_battery}"'
if-shell '[ "$(tmux show-option -gqv @status_datetime)" = "on" ]' \
  'set -agF status-right "#{E:@catppuccin_status_date_time}"'

# ── Plugins, then tpm ─────────────────────────────────────────────────────────
# These substitute their #{...} placeholders into the status line when tpm runs,
# so they are declared unconditionally — a plugin whose segment is switched off
# simply has nothing to substitute.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery' # #{battery_percentage}, #{battery_icon}
set -g @plugin 'tmux-plugins/tmux-cpu'     # #{cpu_percentage}, #{ram_percentage}

# Machine-local overrides, if any. A missing file is not an error.
if-shell "[ -f ~/.config/tmux/local.conf ]" "source-file ~/.config/tmux/local.conf"

# Initialize the tmux plugin manager — KEEP THIS AS THE LAST LINE.
# Anything added below it is ignored.
run '~/.config/tmux/plugins/tpm/tpm'
