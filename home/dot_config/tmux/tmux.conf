# ~/.config/tmux/tmux.conf
# tmux >= 3.1 reads this XDG path; nothing needs to live in $HOME any more.
# Reload with: prefix + r

# ─── Terminal capabilities ────────────────────────────────────────────────────
# This block is the fix for Neovim themes looking washed out inside tmux —
# without it tmux advertises only 256 colours and swallows undercurls.
#   RGB      -> 24-bit truecolour
#   usstyle  -> undercurl + coloured underlines (LSP diagnostics in nvim)
# `terminal-features` (tmux 3.2+) is the modern replacement for the old
# `terminal-overrides` Smulx/Setulc escape-sequence incantations.
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"
set  -as terminal-features ",*:usstyle"

# ─── General behaviour ────────────────────────────────────────────────────────
set  -g  mouse on
set  -g  escape-time 10          # default 500ms makes <Esc> feel laggy in nvim
set  -g  history-limit 50000     # default 2000 is far too small
set  -g  focus-events on         # lets nvim autoread / gitsigns notice changes
set  -g  display-time 2000
set  -g  allow-rename off        # keep the window names setup-session.sh sets

# System clipboard via OSC 52. Works in Ghostty and kitty, locally *and* over
# SSH, on both macOS and Linux — which is why this is preferred over branching
# on pbcopy vs wl-copy/xclip.
set  -g  set-clipboard on

# ─── Key bindings ─────────────────────────────────────────────────────────────
# Prefix stays C-b. Splits, pane navigation and reload are unchanged.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Full reload, theme included. A plain `source-file` does NOT refresh catppuccin
# — it composes its modules with `set -ogq`, so already-composed values survive
# and theme edits silently appear to do nothing. See the script for detail.
bind r run-shell "~/.config/tmux/scripts/reload.sh"

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# vi-style copy mode; y copies to the system clipboard through OSC 52.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ─── Session layout ───────────────────────────────────────────────────────────
# Auto-create the IDE/GIT/Terminal/Logs/Claude layout for every new session.
# The script is idempotent — it no-ops when the session already has >1 window.
# Manual re-apply / fallback: prefix + L
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/setup-session.sh #{session_name}"'
bind L run-shell "~/.config/tmux/scripts/setup-session.sh #{session_name}"

# ─── Plugins ──────────────────────────────────────────────────────────────────
# tpm and the plugins themselves are vendored by chezmoi
# (see home/.chezmoiexternal.toml), so `prefix + I` is not needed on a fresh
# machine.
#
# Pin the plugin path explicitly rather than relying on tpm's XDG auto-detection.
# tpm only auto-detects when TMUX_PLUGIN_MANAGER_PATH is absent from the global
# tmux environment — and that variable is exported into every pane, so a tmux
# session started before this migration leaks the old ~/.tmux/plugins/ value into
# any nested or later-started server. tpm then looks in the wrong place and finds
# nothing, silently, because it pipes all plugin output to /dev/null. Verified
# empirically: this exact failure occurred here.
#
# Note tmux expands "$HOME" in double quotes but does NOT expand a bare ~, so the
# quoting below is load-bearing.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# ─── Catppuccin (v2 API) ──────────────────────────────────────────────────────
# ORDER IS LOAD-BEARING, and differs from v0.3:
#   1. set @catppuccin_* options            (below)
#   2. run catppuccin.tmux                  — defines @thm_* colours + modules
#   3. set status-left / status-right       — must come AFTER step 2
#   4. run tpm                              — LAST; substitutes plugin placeholders
#
# The theme is loaded directly with `run` rather than declared as a tpm @plugin,
# because status-right has to be assembled between the theme loading and tpm
# running. chezmoi vendors it, so there is nothing for tpm to install anyway.

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

# ── Windows ───────────────────────────────────────────────────────────────────
# `rounded` gives the pill-shaped tabs. Other options: basic, slanted, custom, none.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon" # zoom / bell / activity markers

# Show the WINDOW NAME (#W), which setup-session.sh sets to IDE / GIT / Terminal
# / Logs / Claude and `allow-rename off` then preserves.
#
# Both lines matter. Previously window_current_text was "#{pane_current_path}",
# which v2 still honours — that is why the active tab showed a path. And
# window_text was unset, so v2's default of " #T" (pane_title) applied, which
# resolves to the hostname — that is why every other tab showed the machine name.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ── Status modules ────────────────────────────────────────────────────────────
# Overrides must be set BEFORE catppuccin loads: the module files use `set -ogq`,
# which only assigns when the option is still unset, so whatever is set here wins.

# Date, time and timezone.
set -g @catppuccin_date_time_text " %a %d %b  %H:%M %Z"

# Weather: location, condition and temperature, from the cached local script.
# #{l:...} keeps the #(...) unexpanded through the -F expansion of status-right
# below, so tmux re-runs it on each refresh rather than baking in one reading.
set -g @weather_location "Sydney" # any wttr.in-recognised place name
set -g @catppuccin_weather_icon ""
# NOT -gF: an immediate expansion here would resolve @thm_peach BEFORE
# catppuccin.tmux has defined it, silently producing an empty colour
# (status-right rendered "#[fg=]" / "bg="). Storing the format string
# unexpanded lets the module resolve it at load time, when @thm_* exist.
set -g @catppuccin_weather_color "#{E:@thm_peach}"
set -g @catppuccin_weather_text "#{l:#(~/.config/tmux/scripts/weather.sh)}"

# Battery percentage. The #{battery_*} placeholders are provided by tmux-battery,
# which tpm runs in step 4 — the same trick as above, which is why the
# status-right line for it needs -F.
set -g @catppuccin_battery_color "#{E:@thm_green}"

# ── Load the theme ────────────────────────────────────────────────────────────
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

# ── Assemble the status line (AFTER the theme, BEFORE tpm) ────────────────────
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 140
set -g status-interval 15

set -g status-left "#{E:@catppuccin_status_session}"

# -agF, not -ag: the F expands the module now while leaving the plugins' own
# #{...} placeholders literal for tpm to substitute.
set -gF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# ── Plugins, then tpm ─────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery' # provides #{battery_percentage}/#{battery_icon}

# Machine-local overrides, if any. A missing file is not an error.
if-shell "[ -f ~/.config/tmux/local.conf ]" "source-file ~/.config/tmux/local.conf"

# Initialize the tmux plugin manager — KEEP THIS AS THE LAST LINE.
# Anything added below it is ignored.
run '~/.config/tmux/plugins/tpm/tpm'
