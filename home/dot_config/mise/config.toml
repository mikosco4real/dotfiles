# ~/.config/mise/config.toml — global runtime versions.
#
# mise replaces nvm and pyenv. Both were problems in the old .zshrc: nvm added
# noticeable startup cost, and `eval "$(pyenv init --path)"` was unguarded and
# hard-errored on any machine without pyenv.
#
# Activated by dot_config/zsh/conf.d/50-tools.zsh, guarded on the binary
# existing. Per-project overrides go in a project-local mise.toml, which wins
# over this file.
#
# Apply with `mise install`; .chezmoiscripts/run_onchange_after_21 does it
# automatically whenever this file changes.

[tools]
# Omarchy's agent setup writes claude/codex/gh into this file and resolves all
# three through mise — `command -v claude` points at
# ~/.local/share/mise/installs/claude/latest/claude. They are kept here so a
# chezmoi apply does not pull them out of PATH on an Omarchy machine. They are
# harmless elsewhere: mise just installs three extra CLIs.
claude = "latest"
codex  = "latest"
gh     = "latest"

node   = "lts"
python = "3.13"
bun    = "latest"

# PHP is deliberately absent on macOS: Laravel Herd owns `php` there, and
# conf.d/70-darwin.zsh puts Herd ahead of any mise shim on PATH. Herd is a macOS
# GUI app with no Linux equivalent, so on Linux mise provides PHP instead.
# Uncomment on a Linux machine that needs PHP, or set it per-project:
#   mise use php@8.4
# php = "8.4"

# Go, Java and uv come from Homebrew (see dot_config/homebrew/Brewfile) rather
# than mise — they are stable, rarely need per-project pinning here, and the
# brew builds integrate better with the rest of the toolchain.

[settings]
# Don't silently run arbitrary code from a project's mise.toml.
trusted_config_paths = ["~/.config/mise"]

[settings.upgrade]
# Carried over from Omarchy's version of this file. Without it, `mise upgrade`
# removes the old version of a tool as soon as the new one is in place, which
# leaves nothing to roll back to when an upgrade goes wrong.
auto_prune = false
