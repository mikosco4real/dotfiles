# ~/.gitmux.conf — git status for the tmux status line.
#
# Only read when the gitmux segment is enabled:
#   set -g @status_gitmux "on"     in ~/.config/tmux/tmux.conf
# gitmux itself comes from Homebrew (see dot_config/homebrew/Brewfile).
#
# The path is not configurable: catppuccin's gitmux module hardcodes
# `gitmux -cfg $HOME/.gitmux.conf`, which is why this lives in $HOME rather than
# under XDG.
#
# The #{@thm_*} references are tmux user options defined by the catppuccin theme,
# and tmux expands them when it renders the status line — so these styles track
# the active flavour automatically instead of hardcoding Mocha hex values.
tmux:
  symbols:
    branch: " "
    hashprefix: ":"
    ahead: "↑·"
    behind: "↓·"
    staged: "● "
    conflict: "✖ "
    modified: "✚ "
    untracked: "… "
    stashed: "⚑ "
    clean: "✔"
    insertions: "Σ"
    deletions: "Δ"
  styles:
    clear: "#[fg=#{@thm_fg}]"
    state: "#[fg=#{@thm_red},bold]"
    branch: "#[fg=#{@thm_fg},bold]"
    remote: "#[fg=#{@thm_teal}]"
    divergence: "#[fg=#{@thm_fg}]"
    staged: "#[fg=#{@thm_green},bold]"
    conflict: "#[fg=#{@thm_red},bold]"
    modified: "#[fg=#{@thm_yellow},bold]"
    untracked: "#[fg=#{@thm_mauve},bold]"
    stashed: "#[fg=#{@thm_blue},bold]"
    clean: "#[fg=#{@thm_rosewater},bold]"
    insertions: "#[fg=#{@thm_green}]"
    deletions: "#[fg=#{@thm_red}]"
  layout: [branch, divergence, " - ", flags]
  options:
    branch_max_len: 24
    branch_trim: right
    ellipsis: …
    hide_clean: false
    swap_divergence: false
