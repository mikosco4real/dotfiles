name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because dotfiles rot from UPSTREAM changes far more often than from
  # your own commits — a renamed cask, a moved plugin tag, a new Ubuntu default.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (shellcheck, shfmt, zsh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck zsh
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" \
            -o /usr/local/bin/shfmt && sudo chmod +x /usr/local/bin/shfmt || \
            sudo mv shfmt /usr/local/bin/shfmt 2>/dev/null || true
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: shellcheck rendered chezmoi scripts
        # The scripts are Go templates, so they must be rendered before linting.
        # chezmoi needs a config to render, hence init --promptDefaults first.
        run: |
          chezmoi init --promptDefaults --source="$PWD"
          fail=0
          for f in home/.chezmoiscripts/*.tmpl; do
            out=$(chezmoi execute-template < "$f" 2>/dev/null || true)
            if [ -z "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
              echo "skip (empty on this OS): $f"; continue
            fi
            printf '%s' "$out" > /tmp/r.sh
            echo "--- $f"
            bash -n /tmp/r.sh || fail=1
            shellcheck -S warning /tmp/r.sh || fail=1
          done
          exit $fail

      - name: shfmt on real shell files
        run: shfmt -d -i 2 -ci -sr test/

      - name: zsh -n on every zsh fragment
        # shellcheck cannot parse zsh, so syntax-check with zsh itself.
        run: |
          fail=0
          for f in home/dot_zshenv \
                   home/dot_config/zsh/dot_zshenv \
                   home/dot_config/zsh/dot_zprofile \
                   home/dot_config/zsh/dot_zshrc \
                   home/dot_config/zsh/conf.d/*.zsh; do
            zsh -n "$f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail

      - name: Brewfile is valid Ruby
        run: ruby -c home/dot_config/homebrew/Brewfile

  bootstrap:
    name: bootstrap ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runs-on: ubuntu-latest
            container: ubuntu:24.04
          - name: ubuntu-22.04
            runs-on: ubuntu-latest
            container: ubuntu:22.04
          - name: macos-latest
            runs-on: macos-latest
            container: ""
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare bare container
        # Minimal images have no sudo, curl or git — which is exactly the point:
        # run_once_before_00-bootstrap-pkg-manager has to cope with that.
        if: matrix.container != ''
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            sudo ca-certificates curl file git locales procps build-essential zsh

      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: init + first apply
        run: |
          chezmoi init --promptDefaults --source="$PWD"
          chezmoi apply --verbose

      - name: assert the shell actually starts
        # The single highest-value assertion in this workflow. This is the class
        # of failure the old unguarded `eval "$(pyenv init --path)"` was.
        run: |
          zsh -i -c 'exit'
          zsh -l -i -c 'exit'
          test "$(zsh -l -i -c 'printf %s $ZDOTDIR')" = "$HOME/.config/zsh"
          test -z "$(zsh -l -i -c 'printf %s ${ZSH:-}')"   # no oh-my-zsh
          test "$(zsh -l -i -c 'print -l $path' | sort | uniq -d | wc -l)" -eq 0

      - name: assert deployed layout
        run: |
          test -L "$HOME/.config/nvim"                       # ONE folded symlink
          test -f "$HOME/.config/nvim/.stylua.toml"
          test -e "$HOME/.config/tmux/tmux.conf"
          test -x "$HOME/.config/tmux/scripts/setup-session.sh"
          test -x "$HOME/.config/tmux/plugins/tpm/tpm"
          test -f "$HOME/.config/tmux/plugins/tmux/catppuccin.tmux"
          test -f "$HOME/.config/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh"
          grep -q '\[user\]' "$HOME/.gitconfig"
          test -z "$(find "$HOME" -maxdepth 4 -xtype l 2>/dev/null)"

      - name: assert OS-specific files were gated correctly
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -e "$HOME/.config/ghostty/config.darwin"
            test ! -e "$HOME/.config/ghostty/config.linux"
          else
            test -e "$HOME/.config/ghostty/config.linux"
            test ! -e "$HOME/.config/ghostty/config.darwin"
          fi

      - name: SECOND apply must be a no-op (idempotency)
        run: |
          out="$(chezmoi apply --verbose 2>&1 || true)"
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qE '^\+\+\+ b/'; then
            echo "::error::second apply changed files — bootstrap is not idempotent"
            exit 1
          fi
          status="$(chezmoi status || true)"
          if [ -n "$status" ]; then
            echo "::error::chezmoi status dirty after apply: $status"
            exit 1
          fi
